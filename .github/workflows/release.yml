name: Build Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: admonitio-windows
            binary_path: dist/admonitio/admonitio.exe
          - os: ubuntu-latest
            artifact_name: admonitio-linux
            binary_path: dist/admonitio/admonitio

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller --name admonitio --windowed --paths src --add-data "assets;assets" src/admonitio/main.py

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run pyinstaller --name admonitio --windowed --paths src --add-data "assets:assets" src/admonitio/main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/admonitio/
