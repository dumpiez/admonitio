name: Build admonitio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build for Windows
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller --noconfirm --clean --name admonitio --windowed --paths src --add-data "assets;assets" src/admonitio/main.py

      - name: Build for Linux
        if: runner.os == 'Linux'
        run: |
          uv run pyinstaller --noconfirm --clean --name admonitio --windowed --paths src --add-data "assets:assets" src/admonitio/main.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: admonitio-${{ matrix.os }}
          path: dist/admonitio/

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v5
        with:
          pattern: admonitio-*
          path: artifacts
          merge-multiple: false

      - name: Package builds
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          for folder in Path("artifacts").iterdir():
              if folder.is_dir():
                  with ZipFile(f"{folder.name}.zip", "w", ZIP_DEFLATED) as archive:
                      for file in folder.rglob("*"):
                          if file.is_file():
                              archive.write(file, file.relative_to(folder.parent))
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.zip --generate-notes
