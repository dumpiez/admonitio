name: Build Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: admonitio-windows
            binary_path: dist/admonitio/admonitio.exe
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            artifact_name: admonitio-linux
            binary_path: dist/admonitio/admonitio



    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv and Install Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          python-version: "3.12"
          python-arch: "x86_64"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller --name admonitio --windowed --paths src --add-data "assets;assets" src/admonitio/main.py

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run pyinstaller --name admonitio --windowed --paths src --add-data "assets:assets" src/admonitio/main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/admonitio/
