[project]
name = "admonitio"
version = "0.0.1"
description = "an application that runs in the background that constantly reminds you at random times to get you to stay productive"
readme = "README.md"
authors = [
    { name = "dumpiez", email = "nightlypie@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.12.0",
]

[project.scripts]
admonitio = "admonitio:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.basedpyright]
extraPaths = ["src"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
